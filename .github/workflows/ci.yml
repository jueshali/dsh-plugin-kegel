name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The plugin declares no runtime dependencies: the client half only
      # requires the shell-seeded "react", and the test stubs every browser
      # seam. Nothing to install.
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js

      - name: Smoke test
        run: node test/smoke.mjs
